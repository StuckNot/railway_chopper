name: railway_chopper
description: "A chopper client factory and a Response -> Either<NetworkFailure, T> mapper for railway-oriented error handling in Flutter/Dart."
version: 0.2.0
homepage: https://github.com/StuckNot/railway_chopper
repository: https://github.com/StuckNot/railway_chopper

environment:
  sdk: ^3.11.5

dependencies:
  chopper: ^8.6.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  chopper_generator: ^8.6.2
  mocktail: ^1.0.5
  test: ^1.31.1
